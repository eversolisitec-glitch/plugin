# --- Duper de atril ---
# Título del libro firmado que va en el atril
single-title: duper        # duplica 1 item
stack-title: stackduper    # duplica el stack completo

# Distancia (en bloques) desde el atril hasta los marcos
radius: 3

# --- Barril de item shadowing ---
# Nombre que debe tener el barril (renómbralo en el yunque)
barrel-name: stack

# Items que NO se pueden duplicar. Vacío = se duplica TODO.
blacklist: []
